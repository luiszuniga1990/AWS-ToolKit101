AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'ASMMv2 - Stack 5: Agent (Bedrock AgentCore)'

Parameters:
  ProjectName:
    Type: String
    Default: asmmv2
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  FoundationModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Subnet IDs for Lambda VPC configuration
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security Group IDs for Lambda VPC configuration
  KmsKeyArn:
    Type: String
    Description: KMS Key ARN for encrypting Lambda environment variables

Resources:
  # Knowledge Base con el AWS Security Maturity Model v2
  KnowledgeBaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-kb-docs'
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref KBLogsBucket
        LogFilePrefix: kb-access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  KBLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-kb-logs'
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: self-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  # DLQ for failed Lambda invocations
  AgentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-agent-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref KmsKeyArn

  # API Gateway Access Log Group
  AgentApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${Environment}-agent'
      RetentionInDays: 30
      KmsKeyId: !Ref KmsKeyArn

  # Rol del Agente
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-agent-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${FoundationModelId}'
        - PolicyName: KBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt KnowledgeBaseBucket.Arn
                  - !Sub '${KnowledgeBaseBucket.Arn}/*'

  # Lambda de orquestación - conecta assessment results con el agente
  AgentOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-agent-orchestrator'
      Handler: agent_orchestrator.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: 10
      KmsKeyArn: !Ref KmsKeyArn
      CodeUri: ./lambdas/agent/
      Description: Orquesta el agente - recibe resultados del assessment y genera recomendaciones
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AgentDLQ.Arn
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          MODEL_ID: !Ref FoundationModelId
          KB_BUCKET: !Ref KnowledgeBaseBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeAgent
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !GetAtt KnowledgeBaseBucket.Arn
                - !Sub '${KnowledgeBaseBucket.Arn}/*'

  AgentApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-agent-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: ['Content-Type', 'Authorization']

  AgentApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AgentApi
      StageName: !Ref Environment
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt AgentApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status"}'

  AgentOrchestratorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AgentApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentOrchestratorFunction.Arn
      PayloadFormatVersion: '2.0'

  AgentOrchestratorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AgentApi
      RouteKey: POST /chat
      Target: !Sub 'integrations/${AgentOrchestratorIntegration}'

  AgentOrchestratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentOrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AgentApi}/*/*'

Outputs:
  AgentApiUrl:
    Value: !Sub 'https://${AgentApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AgentApiUrl'
  KnowledgeBaseBucketName:
    Value: !Ref KnowledgeBaseBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-KBBucket'
